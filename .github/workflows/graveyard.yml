name: grow graveyard
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: lxy426329/github-graveyard@v0.5.1
        with:
          user: lxy426329
          output: assets/graveyard-live.svg
          history: graveyard-history.json
          links-output: graveyard-links.md
          minimum-days: '30'
          limit: '8'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: place visiting paths under the graves
        run: |
          python - <<'PY'
          from pathlib import Path
          readme=Path('README.md'); links=Path('graveyard-links.md').read_text().strip()
          s=readme.read_text(); a='<!-- graveyard-links:start -->'; b='<!-- graveyard-links:end -->'
          block=a+'\n<sub>↗ '+links+'</sub>\n'+b
          readme.write_text(s[:s.index(a)]+block+s[s.index(b)+len(b):])
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/graveyard-live.svg graveyard-history.json graveyard-links.md README.md
          git diff --cached --quiet || git commit -m "chore: let the graveyard grow"
          git push
