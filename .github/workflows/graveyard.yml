name: grow graveyard
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: lxy426329/github-graveyard@v0.2.0
        with:
          user: lxy426329
          output: assets/graveyard-live.svg
          history: graveyard-history.json
          minimum-days: '30'
          limit: '8'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/graveyard-live.svg graveyard-history.json
          git diff --cached --quiet || git commit -m "chore: let the graveyard grow"
          git push
